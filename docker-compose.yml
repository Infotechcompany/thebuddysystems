name: ${COMPOSE_PROJECT_NAME:-thebuddysystems}

services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE in .env before deployment}
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD_FILE: /run/secrets/db_password
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:80"
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTPS_PORT:-8443}:443"
    volumes:
      - app_data:/var/www/html
    networks:
      - frontend
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cpus: ${APP_CPUS:-0.50}
    mem_limit: ${APP_MEMORY_LIMIT:-256m}
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    secrets:
      - db_password

  db:
    image: ${MARIADB_IMAGE:?Set MARIADB_IMAGE in .env after reviewing the database upgrade path}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/db_root_password
      MARIADB_DATABASE: ${DB_NAME:?Set DB_NAME in .env}
      MARIADB_USER: ${DB_USER:?Set DB_USER in .env}
      MARIADB_PASSWORD_FILE: /run/secrets/db_password
    volumes:
      - db_data:/var/lib/mysql
    configs:
      - source: db_custom_config
        target: /etc/mysql/conf.d/99-buddysystems.cnf
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    cpus: ${DB_CPUS:-1.00}
    mem_limit: ${DB_MEMORY_LIMIT:-512m}
    pids_limit: 512
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    secrets:
      - db_root_password
      - db_password

networks:
  frontend:
  backend:
    internal: true

volumes:
  db_data:
  app_data:

configs:
  db_custom_config:
    file: ./config/my.cnf

secrets:
  db_root_password:
    file: ./.secrets/db_root_password.txt
  db_password:
    file: ./.secrets/db_password.txt
