name: Validate and deploy Proofline Projects subsite

on:
  pull_request:
    branches: [main]
    paths:
      - "proofline-portfolio/**"
      - ".github/workflows/proofline-pages.yml"
  push:
    branches: [main]
    paths:
      - "proofline-portfolio/**"
      - ".github/workflows/proofline-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate immutable portfolio release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reconstruct, verify, and inspect
        shell: bash
        run: bash proofline-portfolio/build-pages-subsite.sh

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}proofline-projects/
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build verified subsite artifact
        shell: bash
        run: bash proofline-portfolio/build-pages-subsite.sh

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Verify live portfolio endpoint
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}proofline-projects/
        run: |
          set -euo pipefail
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT

          fetched=false
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "$SITE_URL" -o "$tmp_dir/index.html" \
              && curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "${SITE_URL}VERSION" -o "$tmp_dir/VERSION" \
              && curl --fail --silent --show-error --location \
                --connect-timeout 10 --max-time 30 \
                "${SITE_URL}DEPLOYMENT_PROVENANCE.json" \
                -o "$tmp_dir/DEPLOYMENT_PROVENANCE.json"; then
              fetched=true
              break
            fi
            sleep 5
          done

          test "$fetched" = true
          grep -Fq '<title>The Next Impossible — Proofline Projects</title>' \
            "$tmp_dir/index.html"
          grep -Fxq '3.1.1-pages-subpath' "$tmp_dir/VERSION"
          python - "$tmp_dir/DEPLOYMENT_PROVENANCE.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              data = json.load(handle)

          assert data["upstream_sha256"] == (
              "f44f22da0241b6ca23a897bd5de3ecd2ec6666fe51eb81aa37fec4f1847a9cbe"
          )
          assert data["deployment_path"] == "/proofline-projects/"
          PY

          printf 'Live endpoint verified: %s\n' "$SITE_URL"
