name: Compose CI

on:
  push:
    branches: [main]
    paths:
      - "docker-compose.yml"
      - "setup.sh"
      - ".env.example"
      - ".gitignore"
      - "config/**"
      - "templates-2.0.json"
      - ".github/workflows/compose-ci.yml"
  pull_request:
    paths:
      - "docker-compose.yml"
      - "setup.sh"
      - ".env.example"
      - ".gitignore"
      - "config/**"
      - "templates-2.0.json"
      - ".github/workflows/compose-ci.yml"

permissions:
  contents: read

concurrency:
  group: compose-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Exercise legacy credential migration
        run: |
          set -euo pipefail
          mkdir -p .secrets
          printf '%s\n' 'ci-only-root-password' > .secrets/db_root_pwd.txt
          printf '%s\n' 'ci-only-app-password' > .secrets/mysql_pwd.txt
          chmod 600 .secrets/*.txt
          bash setup.sh --validate-only
          cmp -s .secrets/db_root_pwd.txt .secrets/db_root_password.txt
          cmp -s .secrets/mysql_pwd.txt .secrets/db_password.txt
          test "$(stat -c '%a' .env)" = "600"
          test "$(stat -c '%a' .secrets/db_root_password.txt)" = "600"
          test "$(stat -c '%a' .secrets/db_password.txt)" = "600"

      - name: Reject conflicting retained credentials
        run: |
          set -euo pipefail
          printf '%s\n' 'stale-root-password' > .secrets/db_root_pwd.txt
          if bash setup.sh --validate-only >conflict.log 2>&1; then
            echo "setup unexpectedly accepted conflicting canonical and legacy credentials" >&2
            exit 1
          fi
          grep -F 'Conflicting canonical or legacy secret files' conflict.log
          printf '%s\n' 'ci-only-root-password' > .secrets/db_root_pwd.txt

      - name: Preserve checkout-derived project identity
        run: |
          set -euo pipefail
          test_root="$(mktemp -d)"
          legacy_checkout="$test_root/legacy-install"
          mkdir -p "$legacy_checkout/.secrets" "$legacy_checkout/config"
          cp docker-compose.yml .env.example "$legacy_checkout/"
          cp config/my.cnf "$legacy_checkout/config/"
          cp .secrets/db_root_password.txt .secrets/db_password.txt "$legacy_checkout/.secrets/"
          env -u COMPOSE_PROJECT_NAME docker compose \
            --project-directory "$legacy_checkout" \
            --env-file "$legacy_checkout/.env.example" \
            -f "$legacy_checkout/docker-compose.yml" \
            config --format json > "$test_root/compose.json"
          python3 - "$test_root/compose.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              model = json.load(stream)
          assert model["name"] == "legacy-install", model["name"]
          PY

      - name: Validate shell syntax
        run: bash -n setup.sh

      - name: Validate Compose model
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose config --format json > compose.resolved.json

      - name: Assert deployment invariants
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          model = json.loads(Path("compose.resolved.json").read_text())
          services = model["services"]
          app = services["app"]
          db = services["db"]

          def network_names(service):
              networks = service.get("networks", {})
              return set(networks if isinstance(networks, list) else networks.keys())

          def secret_names(service):
              secrets = service.get("secrets", [])
              names = set()
              for secret in secrets:
                  names.add(secret if isinstance(secret, str) else secret["source"])
              return names

          assert {"frontend", "backend"} <= network_names(app), network_names(app)
          assert network_names(db) == {"backend"}, network_names(db)
          assert model["networks"]["backend"].get("internal") is True
          assert not db.get("ports"), "database must not publish a host port"
          assert app.get("depends_on", {}).get("db", {}).get("condition") == "service_healthy"
          assert app.get("read_only") is True
          assert "no-new-privileges:true" in app.get("security_opt", [])
          assert "no-new-privileges:true" in db.get("security_opt", [])
          assert {"db_password"} <= secret_names(app)
          assert {"db_password", "db_root_password"} <= secret_names(db)
          assert {"db_password", "db_root_password"} <= set(model.get("secrets", {}))
          assert "db_custom_config" in model.get("configs", {})
          PY

      - name: Validate Portainer template JSON
        run: python3 -m json.tool templates-2.0.json >/dev/null

      - name: Upload resolved non-secret model
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: resolved-compose-model
          path: compose.resolved.json
          if-no-files-found: error
          retention-days: 14
